<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تماس با ما | BA.SH</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>

  :root {
    --deep-teal: #778090;
    --soft-teal: #4a8080;
    --bone: #FFFFFF;
    --ink: #1c2a2a;
    --accent: #4169E1;
    --card-bg: #FFFFFF;
    --card-border: #e0dcd3;
  }

  html[data-theme="dark"] {
    --deep-teal: #2a3540;
    --soft-teal: #3a4a55;
    --bone: #12181c;
    --ink: #e8ecef;
    --accent: #5a8dee;
    --card-bg: #1c2429;
    --card-border: #2e383e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bone);
    color: var(--ink);
    line-height: 1.7;
    transition: background 0.3s ease, color 0.3s ease;
  }

  header {
    background: var(--deep-teal); color: white; padding: 20px 6%;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  header .logo { font-size: 1.4rem; font-weight: bold; }
  nav a {
    color: white; text-decoration: none; margin-right: 24px; font-size: 0.95rem;
    position: relative; padding-bottom: 4px;
  }
  nav a::after {
    content: ''; position: absolute; bottom: 0; right: 0; width: 0; height: 2px;
    background: white; transition: width 0.3s ease;
  }
  nav a:hover::after { width: 100%; }

  #langToggle, #themeToggle {
    background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4);
    border-radius: 4px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
  }

  .contact {
    padding: 80px 6%;
    max-width: 500px;
  }
  .contact h1 {
    color: var(--deep-teal);
    margin-bottom: 24px;
    font-size: 2rem;
  }
  .contact p {
    margin-bottom: 12px;
    font-size: 1.1rem;
    color: #444;
  }
  html[data-theme="dark"] .contact p { color: #c5cdd3; }
  .contact h2 {
    margin-top: 40px;
    margin-bottom: 16px;
    color: var(--deep-teal);
    font-size: 1.3rem;
  }
  .contact input, .contact textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid var(--card-border);
    border-radius: 4px;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--card-bg);
    color: var(--ink);
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 12px 28px;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #a85a3a; }

  footer { padding: 30px 6%; background: var(--deep-teal); color: #cde; text-align: center; font-size: 0.9rem; }

  @media (max-width: 600px) {
    header { flex-direction: column; text-align: center; gap: 10px; }
    nav a { margin: 0 10px; }
  }


  /* ===== Glass + gradient layer ===== */
  :root {
    --accent: #6366f1; --accent-2: #06b6d4; --accent-3: #ec4899;
    --heading: #1e1b4b; --ink: #1e293b; --muted: #475569;
    --glass: rgba(255,255,255,0.55); --glass-strong: rgba(255,255,255,0.72);
    --glass-border: rgba(255,255,255,0.8); --glass-shadow: 0 8px 32px rgba(79,70,229,0.14);
    --field-bg: rgba(255,255,255,0.65); --modal-bg: rgba(255,255,255,0.92);
    --page-bg:
      radial-gradient(55% 45% at 10% 10%, rgba(99,102,241,0.38), transparent 62%),
      radial-gradient(50% 42% at 92% 14%, rgba(236,72,153,0.30), transparent 62%),
      radial-gradient(55% 48% at 82% 92%, rgba(6,182,212,0.32), transparent 62%),
      radial-gradient(48% 42% at 6% 88%, rgba(168,85,247,0.28), transparent 62%),
      #eef2ff;
  }
  html[data-theme="dark"] {
    --accent: #818cf8; --heading: #f8fafc; --ink: #e2e8f0; --muted: #a5b0c4;
    --glass: rgba(255,255,255,0.07); --glass-strong: rgba(14,18,38,0.62);
    --glass-border: rgba(255,255,255,0.15); --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
    --field-bg: rgba(255,255,255,0.08); --modal-bg: rgba(18,24,48,0.94);
    --page-bg:
      radial-gradient(55% 45% at 10% 10%, rgba(99,102,241,0.42), transparent 62%),
      radial-gradient(50% 42% at 92% 14%, rgba(236,72,153,0.26), transparent 62%),
      radial-gradient(55% 48% at 82% 92%, rgba(6,182,212,0.28), transparent 62%),
      radial-gradient(48% 42% at 6% 88%, rgba(168,85,247,0.30), transparent 62%),
      #0a0f1f;
  }

  body { -webkit-font-smoothing: antialiased; }
  body::before {
    content: ''; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background: var(--page-bg);
    animation: meshDrift 22s ease-in-out infinite alternate;
  }
  @keyframes meshDrift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to { transform: translate3d(-2%, 2%, 0) scale(1.08); }
  }

  header {
    background: var(--glass-strong); color: var(--heading);
    backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%);
    border-bottom: 1px solid var(--glass-border);
  }
  header .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; color: var(--heading); }
  nav a { color: var(--heading); }
  nav a::after { background: linear-gradient(90deg, var(--accent), var(--accent-3)); }
  .menu-toggle { color: var(--heading); }
  #langToggle, #themeToggle {
    background: var(--glass); color: var(--heading); border: 1px solid var(--glass-border);
    border-radius: 999px; transition: background 0.2s, transform 0.2s;
  }
  #langToggle:hover, #themeToggle:hover { background: var(--glass-strong); transform: translateY(-1px); }

  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .hero h1, header .logo {
      background: linear-gradient(90deg, var(--accent), var(--accent-3) 55%, var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
  }

  .btn, .btn:hover {
    background: linear-gradient(135deg, var(--accent), var(--accent-3)); color: white;
  }
  .btn {
    border-radius: 999px; padding: 16px 38px; font-weight: 700; border: none;
    box-shadow: 0 10px 30px rgba(99,102,241,0.45);
    transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-3px); box-shadow: 0 14px 36px rgba(236,72,153,0.4); }

  footer { background: linear-gradient(135deg, #4f46e5, #9333ea 55%, #db2777); color: rgba(255,255,255,0.92); }

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent-2); outline-offset: 2px;
  }

  body { display: flex; flex-direction: column; min-height: 100vh; }
  footer { margin-top: auto; }
  .about, .contact {
    margin: 56px auto; padding: 48px 40px; border-radius: 28px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: var(--glass-shadow);
  }
  .about { width: min(92%, 740px); max-width: none; }
  .contact { width: min(92%, 560px); max-width: none; }
  .about h1, .contact h1, .contact h2 { color: var(--heading); }
  .about h1::after, .contact h1::after {
    content: ''; display: block; width: 64px; height: 5px; border-radius: 5px; margin-top: 14px;
    background: linear-gradient(90deg, var(--accent), var(--accent-3));
  }
  .about p, .contact p, html[data-theme="dark"] .about p, html[data-theme="dark"] .contact p { color: var(--muted); }
  .contact input, .contact textarea {
    background: var(--field-bg); color: var(--ink); border: 1px solid var(--glass-border);
    border-radius: 14px; padding: 13px 16px;
  }
  .contact input::placeholder, .contact textarea::placeholder { color: var(--muted); }
  @media (max-width: 600px) { .about, .contact { padding: 32px 22px; margin: 32px auto; } }
</style>
</head>
<body>

  <header>
    <div class="logo">BA.SH</div>
    <nav>
      <a href="index.html" data-fa="خانه" data-en="Home">خانه</a>
      <button id="langToggle" onclick="toggleLang()">EN</button>
      <button id="themeToggle" onclick="toggleTheme()">🌙</button>
      <a href="about.html" data-fa="درباره ما" data-en="About Us">درباره ما</a>
      <a href="contact.html" data-fa="تماس با ما" data-en="Contact Us">تماس با ما</a>
    </nav>
  </header>

  <section class="contact">
    <h1 data-fa="تماس با ما" data-en="Contact Us">تماس با ما</h1>
    <p data-fa="📞 تلفن: 09023135666" data-en="📞 Phone: 09023135666">📞 تلفن: 09023135666</p>
    <p data-fa="📧 ایمیل: info@bash.com" data-en="📧 Email: info@bash.com">📧 ایمیل: info@bash.com</p>
    <p data-fa="📍 آدرس: تهران" data-en="📍 Address: Tehran">📍 آدرس: تهران</p>

    <h2 data-fa="پیام بفرستید" data-en="Send us a message">پیام بفرستید</h2>
    <form action="https://formspree.io/f/xxxxxxx" method="POST">
      <input type="text" name="name" required
        data-fa-placeholder="نام شما" data-en-placeholder="Your name"
        placeholder="نام شما">

      <input type="email" name="email" required
        data-fa-placeholder="ایمیل شما" data-en-placeholder="Your email"
        placeholder="ایمیل شما">

      <textarea name="message" rows="5" required
        data-fa-placeholder="پیام شما" data-en-placeholder="Your message"
        placeholder="پیام شما"></textarea>

      <button type="submit" class="btn" data-fa="ارسال پیام" data-en="Send Message">ارسال پیام</button>
    </form>
  </section>

  <footer>
    <p>BA.SH</p>
  </footer>

  <script>
    let currentLang = 'fa';

    function applyLang(lang) {
      document.querySelectorAll('[data-fa]').forEach(function(el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      document.querySelectorAll('[data-fa-placeholder]').forEach(function(el) {
        el.placeholder = el.getAttribute('data-' + lang + '-placeholder');
      });
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('langToggle').textContent = lang === 'fa' ? 'EN' : 'FA';
    }

    function toggleLang() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      applyLang(currentLang);
      try { localStorage.setItem('lang', currentLang); } catch (e) {}
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    }

    (function restoreSettings() {
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) setTheme(savedTheme);
        const savedLang = localStorage.getItem('lang');
        if (savedLang) { currentLang = savedLang; applyLang(savedLang); }
      } catch (e) {}
    })();
  </script>

</body>
</html>
