<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تماس با ما | BA.SH</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>

  :root {
    --deep-teal: #778090;
    --soft-teal: #4a8080;
    --bone: #FFFFFF;
    --ink: #1c2a2a;
    --accent: #4169E1;
    --card-bg: #FFFFFF;
    --card-border: #e0dcd3;
  }

  html[data-theme="dark"] {
    --deep-teal: #2a3540;
    --soft-teal: #3a4a55;
    --bone: #12181c;
    --ink: #e8ecef;
    --accent: #5a8dee;
    --card-bg: #1c2429;
    --card-border: #2e383e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bone);
    color: var(--ink);
    line-height: 1.7;
    transition: background 0.3s ease, color 0.3s ease;
  }

  header {
    background: var(--deep-teal); color: white; padding: 20px 6%;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  header .logo { font-size: 1.4rem; font-weight: bold; }
  nav a {
    color: white; text-decoration: none; margin-right: 24px; font-size: 0.95rem;
    position: relative; padding-bottom: 4px;
  }
  nav a::after {
    content: ''; position: absolute; bottom: 0; right: 0; width: 0; height: 2px;
    background: white; transition: width 0.3s ease;
  }
  nav a:hover::after { width: 100%; }

  #langToggle, #themeToggle {
    background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4);
    border-radius: 4px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
  }

  .contact {
    padding: 80px 6%;
    max-width: 500px;
  }
  .contact h1 {
    color: var(--deep-teal);
    margin-bottom: 24px;
    font-size: 2rem;
  }
  .contact p {
    margin-bottom: 12px;
    font-size: 1.1rem;
    color: #444;
  }
  html[data-theme="dark"] .contact p { color: #c5cdd3; }
  .contact h2 {
    margin-top: 40px;
    margin-bottom: 16px;
    color: var(--deep-teal);
    font-size: 1.3rem;
  }
  .contact input, .contact textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid var(--card-border);
    border-radius: 4px;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--card-bg);
    color: var(--ink);
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 12px 28px;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #a85a3a; }

  footer { padding: 30px 6%; background: var(--deep-teal); color: #cde; text-align: center; font-size: 0.9rem; }

  @media (max-width: 600px) {
    header { flex-direction: column; text-align: center; gap: 10px; }
    nav a { margin: 0 10px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">BA.SH</div>
    <nav>
      <a href="index.html" data-fa="خانه" data-en="Home">خانه</a>
      <button id="langToggle" onclick="toggleLang()">EN</button>
      <button id="themeToggle" onclick="toggleTheme()">🌙</button>
      <a href="about.html" data-fa="درباره ما" data-en="About Us">درباره ما</a>
      <a href="contact.html" data-fa="تماس با ما" data-en="Contact Us">تماس با ما</a>
    </nav>
  </header>

  <section class="contact">
    <h1 data-fa="تماس با ما" data-en="Contact Us">تماس با ما</h1>
    <p data-fa="📞 تلفن: 021-00000000" data-en="📞 Phone: 021-00000000">📞 تلفن: 021-00000000</p>
    <p data-fa="📧 ایمیل: info@bash.com" data-en="📧 Email: info@bash.com">📧 ایمیل: info@bash.com</p>
    <p data-fa="📍 آدرس: تهران" data-en="📍 Address: Tehran">📍 آدرس: تهران</p>

    <h2 data-fa="پیام بفرستید" data-en="Send us a message">پیام بفرستید</h2>
    <form action="https://formspree.io/f/xxxxxxx" method="POST">
      <input type="text" name="name" required
        data-fa-placeholder="نام شما" data-en-placeholder="Your name"
        placeholder="نام شما">

      <input type="email" name="email" required
        data-fa-placeholder="ایمیل شما" data-en-placeholder="Your email"
        placeholder="ایمیل شما">

      <textarea name="message" rows="5" required
        data-fa-placeholder="پیام شما" data-en-placeholder="Your message"
        placeholder="پیام شما"></textarea>

      <button type="submit" class="btn" data-fa="ارسال پیام" data-en="Send Message">ارسال پیام</button>
    </form>
  </section>

  <footer>
    <p>BA.SH</p>
  </footer>

  <script>
    let currentLang = 'fa';

    function applyLang(lang) {
      document.querySelectorAll('[data-fa]').forEach(function(el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      document.querySelectorAll('[data-fa-placeholder]').forEach(function(el) {
        el.placeholder = el.getAttribute('data-' + lang + '-placeholder');
      });
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('langToggle').textContent = lang === 'fa' ? 'EN' : 'FA';
    }

    function toggleLang() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      applyLang(currentLang);
      try { localStorage.setItem('lang', currentLang); } catch (e) {}
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    }

    (function restoreSettings() {
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) setTheme(savedTheme);
        const savedLang = localStorage.getItem('lang');
        if (savedLang) { currentLang = savedLang; applyLang(savedLang); }
      } catch (e) {}
    })();
  </script>

</body>
</html>
