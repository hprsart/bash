<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شبکه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-teal: #778090;
    --soft-teal: #4a8080;
    --bone: #FFFFFF;
    --ink: #1c2a2a;
    --accent: #4169E1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bone);
    color: var(--ink);
    line-height: 1.7;
  }

  header {
    background: var(--deep-teal);
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
      position: sticky;
  top: 0;
  z-index: 100;
  }

  header .logo {
    font-size: 1.4rem;
    font-weight: bold;
  }

  nav a {
    color: white;
    text-decoration: none;
    margin-right: 24px;
    font-size: 0.95rem;
  }

  .hero {
    padding: 80px 6% 60px;
    max-width: 720px;
  }

  .hero h1 {
    font-size: 2.4rem;
    color: var(--deep-teal);
    margin-bottom: 20px;
  }

  .hero p {
    font-size: 1.1rem;
    color: #444;
    margin-bottom: 30px;
  }

  .btn {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 12px 28px;
    border-radius: 4px;
    text-decoration: none;
    font-size: 1rem;
    transition: background 0.2s;
  }

  .btn:hover {
    background: #a85a3a;
  }

  .products {
    padding: 60px 6%;
    background: white;
  }

  .products h2 {
    color: var(--deep-teal);
    margin-bottom: 30px;
    font-size: 1.6rem;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
  }

  .product-card {
    border: 1px solid #e0dcd3;
    padding: 24px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
  }

  .product-card h3 {
    color: var(--deep-teal);
    margin-bottom: 8px;
    font-size: 1.1rem;
  }

  .product-card p {
    color: #666;
    font-size: 0.95rem;
  }

  footer {
    padding: 30px 6%;
    background: var(--deep-teal);
    color: #cde;
    text-align: center;
    font-size: 0.9rem;
  }

  @media (max-width: 600px) {
    .hero h1 {
      font-size: 1.6rem;
    }
    .hero { 
      padding: 40px 6% 30px;
    }
    header {
      flex-direction: column;
      text-align: center;
    }
    nav a {
      margin: 0 10px;
    }
  }

  .menu-toggle {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 1.8rem;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .menu-toggle {
      display: block;
    }
    nav#navMenu {
      display: none;
      flex-direction: column;
      width: 100%;
      margin-top: 16px;
    }
    nav#navMenu.open {
      display: flex;
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hero h1 {
    animation: fadeInUp 0.8s ease-out backwards;
  }

  .hero p {
    animation: fadeInUp 0.8s ease-out 0.2s backwards;
  }

  .hero .btn {
    animation: fadeInUp 0.8s ease-out 0.4s backwards;
  }
</style>
</head>
<body>

  <header>
    <div class="logo">BA.SH</div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav id="navMenu">
      <a href="#محصولات">محصولات</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
    </nav>
  </header>

  <section class="hero">
    <h1>تجهیزات شبکه با کیفیت، برای آفیس </h1>
    <p> تأمین و فروش تجهیزات شبکه  معتبر، با مشاوره‌ی تخصصی برای انتخاب درست.</p>
    <a href="#محصولات" class="btn">مشاهده محصولات</a>
  </section>

  <section class="products" id="محصولات">
    <h2>محصولات </h2>
    <div class="product-grid">

      <div class="product-card">
      <img src="server.jpg" alt="سرور" style="width:100%; border-radius:4px; margin-bottom:6px;">
        <h3>سرور</h3>
        <p>نصب و راه اندازی</p>
      </div>

      <div class="product-card">
      <img src="router.jpg" alt="روتر شبکه" style="width:100%; border-radius:4px; margin-bottom:6px;">
        <h3>روتر.</h3>
        <p>روتر بی سیم</p>
      </div>

      <div class="product-card">
      <img src="rak.jpg" alt="رک شبکه" style="width:100%; border-radius:4px; margin-bottom:6px;">
        <h3>رک شبکه</h3>
        <p>ایستاده .دیواری و اوت دور.</p>
      </div>

      <div class="product-card">
      <img src="cable.jpg" alt="کابل شبکه" style="width:100%; border-radius:4px; margin-bottom:6px;">
        <h3>کابل شبکه</h3>
        <p>کابل مسی</p>
      </div>

      <div class="product-card">
      <img src="soket.jpg" alt="سوکت شبکه" style="width:100%; border-radius:4px; margin-bottom:6px;">
        <h3>سوکت  شبکه</h3>
        <p>بسته 100 عددی</p>
      </div>

    </div>
  </section>

  <footer>
    <p>BA.SH</p>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById('navMenu').classList.toggle('open');
    }
  </script>

</body>
</html>
